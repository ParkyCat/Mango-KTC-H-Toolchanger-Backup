
[include toolchanger/readonly-configs/toolchanger-include.cfg]
[include toolchanger-config.cfg]
[include tools/T*.cfg]
[include macros/*.cfg]
[include mainsail.cfg]


[duplicate_pin_override]
pins: PB6, PB6

    
[force_move]
enable_force_move: True

[rounded_path]
resolution: 0.2
replace_g0: False

#####################################################################
#   UUID Setting
#####################################################################
# host MCU service is preinstalled and ready to use with:
[mcu]
canbus_uuid: abcbe6398cf5

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 5000    			
max_z_velocity: 100			
max_z_accel: 1000
square_corner_velocity: 5.0

#####################################################################
#   Carto Stuff
#####################################################################

[mcu cartographer] # See https://www.klipper3d.org/Config_Reference.html#mcu
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_1B0048000550315551333620-if00
restart_method: command # needed for USB

[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 33.3 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: no # For extra output

[bed_mesh]
zero_reference_position: 175, 175 # The centre of your bed. 
speed: 300
horizontal_move_z: 3
mesh_min: 20, 40 # The first probed coordinate, nearest to the origin. This coordinate is relative to the probe's location.
mesh_max: 330, 340 # The probed coordinate farthest from the origin. This is not necessarily the last point probed, as the probing process occurs in a zig-zag fashion. As with mesh_min, this coordinate is relative to the probe's location.
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough

# [bed_mesh]
# speed: 200
# horizontal_move_z: 5
# mesh_min: 20,20
# mesh_max: 330,330
# probe_count: 7,7
# algorithm: bicubic
# bicubic_tension: 0.2

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105


#####################################################################
# 	X/Y Stepper Settings
#####################################################################
# Autotune
[autotune_tmc stepper_x]
motor: ldo-42sth48-2804ah
tuning_goal: performance
# extra_hysteresis: 1
sgt: 2
[autotune_tmc stepper_y]
motor: ldo-42sth48-2804ah
tuning_goal: performance
# extra_hysteresis: 1
sgt: 1
[autotune_tmc stepper_z]
motor: moons-ms17hd6p4200
tuning_goal: performance
# extra_hysteresis: 1
[autotune_tmc stepper_z1]
motor: moons-ms17hd6p4200
tuning_goal: performance
# extra_hysteresis: 1
[autotune_tmc stepper_z2]
motor: moons-ms17hd6p4200
tuning_goal: performance
# extra_hysteresis: 1
[autotune_tmc stepper_z3]
motor: moons-ms17hd6p4200
tuning_goal: performance
# extra_hysteresis: 1

[stepper_x]
step_pin = PE6
dir_pin = PE5
enable_pin = !PC14
microsteps = 32
rotation_distance: 40
endstop_pin = tmc2240_stepper_x:virtual_endstop
position_min: -2
position_endstop: 350
position_max: 350
homing_speed = 100
homing_positive_dir = true

[tmc2240 stepper_x]
cs_pin = PC13
spi_software_miso_pin = PG7
spi_software_sclk_pin = PG8
spi_software_mosi_pin = PG6
diag0_pin = ^!PF4
interpolate = True
run_current = 1.2
# stealthchop_threshold = 0
rref: 12000 

[stepper_y]
step_pin = PE2
dir_pin = PE1
enable_pin = !PE4
microsteps = 32
rotation_distance: 40
endstop_pin = tmc2240_stepper_y:virtual_endstop
position_min: -9
position_endstop: 350
position_max: 350
homing_speed = 100
homing_positive_dir = true

[tmc2240 stepper_y]
cs_pin = PE3
spi_software_miso_pin = PG7
spi_software_sclk_pin = PG8
spi_software_mosi_pin = PG6
diag0_pin = ^!PF3
interpolate = True
run_current = 1.2
rref: 12000 
# stealthchop_threshold = 0


#####################################################################
# 	Z Stepper Settings
#####################################################################

[stepper_z]
step_pin = PB8
dir_pin = !PB7
enable_pin = !PE0
microsteps = 32
rotation_distance = 40
gear_ratio = 80:16
full_steps_per_rotation = 200
# endstop_pin = probe:z_virtual_endstop
endstop_pin: probe:z_virtual_endstop
position_max = 340
position_min = -6.0
homing_speed = 15
second_homing_speed = 8
homing_retract_dist = 0
# homing_retract_dist = 3

[stepper_z1]
